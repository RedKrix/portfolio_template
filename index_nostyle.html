<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Personale - Responsive</title>
    <!-- Collegamento al file CSS esterno -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="menu-icon">☰</div>
        <h1>TITOLO PERSONAL</h1>
        <div class="logo">Logo</div>
    </header>

    <div class="layout-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav>
                <a href="#">CHI SONO</a>
                <a href="#">PROGETTI</a>
                <a href="#">POST</a>
                <a href="#">CONTATTI</a>
                <a href="#">PRIVACY</a>
            </nav>
        </aside>

        <!-- Contenuto Principale -->
        <main class="main-content">
            
            <!-- Sezione Hero -->
            <section class="hero">
                <div class="avatar"></div>
                <div class="hero-text">
                    <h2>NOME COGNOME</h2>
                    <h3>Qualifica</h3>
                    <p>Breve descrizione.</p>
                </div>
                <button class="btn">CONTATTENI</button>
            </section>

            <!-- Sezione Progetti -->
            <section class="section">
                <h2 class="section-title">PROGETTI</h2>
                <div class="projects-grid">
                    <div class="card">SPLUNK</div>
                    <div class="card">FORTINET</div>
                    <div class="card">STAZIONE HETEO</div>
                    <div class="card">FLAG LINUX</div>
                </div>
            </section>

            <!-- Sezione Aggiornamenti -->
            <section class="section">
                <div class="section-header">
                    <h2 class="section-title">AGGIORNAMENTI</h2>
                    <div class="filter">FILTRO XTRO DATA</div>
                </div>
                
                <div class="posts-list">
                    <article class="post">
                        <h3>POST 1</h3>
                        <span>Contenuto</span>
                    </article>
                    <article class="post">
                        <h3>POST 2</h3>
                    </article>
                </div>
            </section>

        </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <span>CV</span>
        <span>LINKEDIN</span>
        <span>DISCORD</span>
        <span>EMAIL</span>
        <span>SEZIONE PRIVACY</span>
    </footer>

</body>
</html>
